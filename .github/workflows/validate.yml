name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-source:
    name: Plugin source
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate plugin layout, descriptor, and repository hygiene
        run: python3 Scripts/ci/validate_plugin.py

      - name: Validate repository-local agent skills
        run: python3 Scripts/ci/validate_skills.py

      - name: Compile CI Python scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m compileall -q Scripts/ci

      - name: Lint workflow files
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          cache: false
          pyflakes: false
