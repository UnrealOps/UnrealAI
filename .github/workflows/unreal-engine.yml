name: Unreal Engine

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unreal-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-test-macos:
    name: Package and test (macOS)
    runs-on: [self-hosted, macOS, unreal-engine]
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true
          persist-credentials: false

      - name: Validate plugin source
        run: python3 Scripts/ci/validate_plugin.py

      - name: Package plugin and run Unreal automation tests
        env:
          UNREAL_ENGINE_ROOT: ${{ vars.UNREAL_ENGINE_ROOT }}
          UNREAL_CI_OUTPUT_DIR: ${{ runner.temp }}/UnrealAI-CI
        run: Scripts/ci/run-unreal-ci.sh

      - name: Upload packaged plugin
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UnrealAI-macOS
          path: ${{ runner.temp }}/UnrealAI-CI/Package
          if-no-files-found: error
          retention-days: 7

      - name: Upload automation report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UnrealAI-automation-report-macOS
          path: ${{ runner.temp }}/UnrealAI-CI/AutomationReport
          if-no-files-found: warn
          retention-days: 7
